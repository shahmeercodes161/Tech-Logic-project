<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="login.css">

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">

    
    <div class="left">
        <h4 class="logo">Auto Diagnex</h4>

        <h2>Login</h2>
        <p class="sub">Welcome back! Please enter your details.</p>

        <form>
            <label>Email</label>
            <div class="input-box">
                <i class="fa fa-envelope"></i>
                <input type="email" placeholder="Enter your email">
            </div>

            <label>Password</label>
            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="Enter your password">
                <i class="fa fa-eye"></i>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">LOG IN</button>
        </form>

        <p class="signup">Don’t have an account? <a href="#">Sign Up</a></p>
    </div>

    
    <div class="right">
        <h1>Welcome Back!</h1>
        <p>
            Login to access your dashboard and manage your automotive diagnostics with ease.
        </p>

        <div class="info">
            <p><i class="fa fa-envelope"></i> support@autodiagnex.com</p>
            <p><i class="fa fa-location-dot"></i> Karachi, Pakistan</p>
            <p><i class="fa fa-phone"></i> +92 300 1234567</p>
        </div>
    </div>

</div>

</body>
<script src="login.js"></script>
</html>
